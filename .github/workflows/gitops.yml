name: Secure Infrastructure GitOps Workflow

on:
  push:
    branches: [ main ]

jobs:
  execute-secure-infrastructure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup R Environment
        uses: r-lib/actions/setup-r@v2

      - name: Restore renv Environment
        uses: r-lib/actions/setup-renv@v2

      - name: Execute Infrastructure Script
        run: |
          Rscript -e 'print("GitOps automated deployment pipeline triggered.")'
          Rscript "CO3 Part 2.R"
